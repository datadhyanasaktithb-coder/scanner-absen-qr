<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scan Absensi · SMK Taruna Harapan Bangsa</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{--bg:#f4f6fb;--fg:#1e293b;--card:#fff;--mut:#64748b}@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--fg:#e2e8f0;--card:#1e293b;--mut:#94a3b8}}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:16px;max-width:460px;margin:auto}
h1{font-size:1.2rem;margin:.2rem 0}p{color:var(--mut);font-size:.85rem;margin:0 0 12px}
#cam{border-radius:18px;overflow:hidden;background:#000}.res{border-radius:14px;padding:14px;margin:12px 0;font-weight:600;background:var(--card);border-left:6px solid #94a3b8}
.res.ok{border-color:#10b981;background:#d1fae5;color:#065f46}.res.no{border-color:#e11d48;background:#ffe4e6;color:#9f1239}.res small{display:block;font-weight:500}
ul{list-style:none;padding:0;font-size:.85rem}li{background:var(--card);padding:8px 12px;border-radius:10px;margin-bottom:6px;display:flex;justify-content:space-between}
</style></head><body>
<h1>📷 Scan Absensi</h1><p>Arahkan QR guru/siswa ke kamera. Guru: scan pertama = masuk, scan kedua = pulang.</p>
<div id="cam"><video id="v" playsinline muted style="width:100%;display:block"></video></div><canvas id="cv" style="display:none"></canvas><div id="r" class="res">Menunggu QR…</div><button id="rb" style="width:100%;padding:12px;border:0;border-radius:12px;background:#4f46e5;color:#fff;font-weight:700">Buka kamera</button><ul id="log"></ul>
<script>
const API=https://script.google.com/macros/s/AKfycby_Pvs_nnvnXIVC-Y_d1TQVl67knqY953hiwaphq-QdXZfP5CTh-sJzaHkfnLmFLH3CAQ/exec
let busy=false,last='';
const $=s=>document.querySelector(s);
const beep=ok=>{try{const c=new AudioContext(),o=c.createOscillator();o.frequency.value=ok?880:220;o.connect(c.destination);o.start();setTimeout(()=>o.stop(),150)}catch{}};
async function onScan(code){
 if(busy||code===last)return;busy=true;last=code;$('#r').className='res';$('#r').textContent='Memproses…';
 try{if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API))throw new Error('URL API belum diisi / salah (harus berakhiran /exec)');
  const r=await(await fetch(API,{method:'POST',body:JSON.stringify({code})})).json();
  $('#r').className='res '+(r.ok?'ok':'no');$('#r').innerHTML=`${r.ok?'✅':'⚠️'} ${r.nama||''}<small>${r.jenis||''} ${r.msg}</small>`;beep(r.ok);
  const li=document.createElement('li');li.innerHTML=`<span>${r.nama||'-'}</span><span>${r.msg}</span>`;$('#log').prepend(li)}
 catch(e){$('#r').className='res no';$('#r').innerHTML='Gagal terhubung ke server<small>'+e.message+'</small>'}
 setTimeout(()=>busy=false,1500);setTimeout(()=>last='',6000);
}
let stream=null,raf=0;
const v=$('#v'),cv=$('#cv'),cx=cv.getContext('2d',{willReadFrequently:true});
const err=(t,d)=>{$('#r').className='res no';$('#r').innerHTML=t+'<small>'+d+'</small>';$('#rb').style.display='block'};
function stopCam(){cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}v.srcObject=null}
function tick(){
 if(stream&&v.readyState>=2&&v.videoWidth){
  cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
  const c=window.jsQR&&jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:'dontInvert'});
  if(c&&c.data)onScan(c.data);
 }
 raf=requestAnimationFrame(tick);
}
async function startCam(){
 stopCam();
 if(/FBAN|FBAV|Instagram|Line\/|MicroMessenger|; wv\)|WhatsApp/i.test(navigator.userAgent))return err('Browser dalam aplikasi tidak mendukung kamera','Buka link ini di Chrome atau Safari (menu ⋮ → Buka di browser).');
 if(!window.isSecureContext||!navigator.mediaDevices)return err('Halaman harus HTTPS','Buka lewat alamat https://… GitHub Pages.');
 if(!window.jsQR)return err('Library QR gagal dimuat','Periksa internet lalu muat ulang.');
 $('#r').className='res';$('#r').textContent='Membuka kamera…';
 const tries=[{video:{facingMode:{ideal:'environment'}},audio:false},{video:true,audio:false}];
 for(const k of tries){
  try{stream=await navigator.mediaDevices.getUserMedia(k);break}
  catch(e){if(k===tries[1]){
   const m={NotAllowedError:'Izin kamera ditolak. Ketuk ikon gembok/kamera di address bar → Izinkan, lalu muat ulang.',NotReadableError:'Kamera sedang dipakai aplikasi/tab lain. Tutup lalu coba lagi.',NotFoundError:'Kamera tidak ditemukan.'};
   return err('Kamera gagal dibuka ('+e.name+')',m[e.name]||e.message)}}
 }
 v.srcObject=stream;try{await v.play()}catch{}
 $('#rb').style.display='none';$('#r').textContent='Menunggu QR…';tick();
}
$('#rb').onclick=startCam;
document.addEventListener('visibilitychange',()=>document.hidden?stopCam():startCam());
addEventListener('pagehide',stopCam);
startCam();
</script></body></html>
